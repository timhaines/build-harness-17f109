name: CI
on:
  workflow_dispatch: {}
  push:
    branches:
      - master
      - beta
      - private-preview
      - sdk-release/**
      - feature/**
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
permissions: {}
jobs:
  build:
    name: 'Static Checks'
    runs-on: 'ubuntu-24.04'
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - run: sh ./ci-build.sh
  test:
    name: Test (${{ matrix.node }})
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        node: ['24','22']
    runs-on: 'ubuntu-24.04'
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - run: sh ./ci-test.sh
  publish:
    name: Publish
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: 'ubuntu-24.04'
    steps:
      - name: Report
        run: echo "MARKER event=${{ github.event_name }} ref=${{ github.ref }}"
